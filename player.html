<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Signage Player</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#000;color:#fff;overflow:hidden;font-family:Inter,Roboto,system-ui,sans-serif;cursor:none}
#stage{position:absolute;left:0;top:0;width:100%;height:100%;overflow:hidden}
#diag{position:absolute;left:8px;bottom:8px;z-index:9;background:rgba(0,0,0,.85);color:#9f9;font:13px/1.35 monospace;padding:8px 10px;border-radius:6px;max-width:70%;white-space:pre-wrap;pointer-events:none}
.zone{position:absolute}
.zc{position:absolute;top:0;right:0;bottom:0;left:0;overflow:hidden}
.m{position:absolute;top:0;right:0;bottom:0;left:0;width:100%;height:100%;transition:opacity .6s ease}
.tick{will-change:transform}
#pair{position:absolute;top:0;right:0;bottom:0;left:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;background:radial-gradient(circle at 50% 40%,#1d2230,#07080b 70%);text-align:center;padding:40px}
#pair h1{margin:0;font-size:44px;font-weight:700}
#pair .code{font-size:150px;font-weight:800;letter-spacing:.12em;color:#ff8a3d;font-variant-numeric:tabular-nums;line-height:1}
#pair p{margin:0;font-size:30px;color:#9aa1b2;max-width:1200px}
#status{position:absolute;right:20px;bottom:16px;font-size:16px;color:#556;opacity:.8}
[hidden]{display:none!important}
</style>
</head>
<body>
<div id="stage" hidden></div>
<div id="pair" hidden>
  <h1>Pair this screen</h1>
  <div class="code" id="code">········</div>
  <p id="pairMsg">In your Signage dashboard, open <b>Screens</b> and enter this code.</p>
</div>
<div id="status"></div>
<div id="diag" hidden></div>

<script src="supabase.js?v=12"></script>
<script src="config.js?v=12"></script>
<script src="render.js?v=12"></script>
<script>
const sb = supabase.createClient(SB_URL, SB_KEY, { auth: { persistSession: false } });
const stage = document.getElementById('stage'), pair = document.getElementById('pair');
const browserVer = (navigator.userAgent.match(/Chrome\/(\d+)/) || [])[1] || '?';
const POLL_MS = 15000;

function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }
function newId() {
  if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => { const r = Math.random() * 16 | 0; return (c === 'x' ? r : (r & 3 | 8)).toString(16); });
}
let device = store('signage.device');
if (!device) { device = newId(); store('signage.device', device); }

let shownKey = null, timers = [], session = 0;
// Size the 1920x1080 design to the TV. Uses whichever viewport size the browser reports, and re-checks often,
// because some Fire TV browsers report the size late or wrongly at start-up.
// The layout fills the screen with plain CSS (100% width/height, zones in %),
// and text sizes use screen-width units, so nothing depends on the browser reporting its size.
window.SIGN_PX = function (n) { return (n / 19.2).toFixed(3) + 'vw'; };
function viewport() {
  const d = document.documentElement;
  return { w: d.clientWidth || window.innerWidth || 0, h: d.clientHeight || window.innerHeight || 0 };
}

// Temporary on-screen info for the first 40 seconds after a layout loads, to diagnose display problems.
const errors = [];
window.addEventListener('error', e => { errors.push((e.message || 'error') + (e.filename ? ' @' + e.filename.split('/').pop() + ':' + e.lineno : '')); }, true);
function diag() {
  const v = viewport(), box = document.getElementById('diag');
  const zs = [...stage.querySelectorAll('.zone')].map((z, i) => {
    const r = z.getBoundingClientRect(), c = z.firstChild, cr = c ? c.getBoundingClientRect() : { width: 0, height: 0 };
    const m = c && c.querySelector('img,video');
    const media = m ? (m.tagName === 'VIDEO' ? 'video ' + (m.error ? 'ERR' + m.error.code : 'rs' + m.readyState) : 'img ' + (m.complete ? (m.naturalWidth ? 'ok' : 'FAIL') : 'loading')) : '';
    return (i + 1) + ' ' + (z.dataset.type || '?') + ' @' + Math.round(r.left) + ',' + Math.round(r.top) + ' ' + Math.round(r.width) + 'x' + Math.round(r.height) + ' inner ' + Math.round(cr.width) + 'x' + Math.round(cr.height) + ' ' + media;
  });
  box.textContent = 'Player v12 · Browser ' + browserVer + ' · viewport ' + v.w + 'x' + v.h + ' (inner ' + innerWidth + 'x' + innerHeight + ') · dpr ' + (window.devicePixelRatio || 1) + '' +
    '\n' + zs.join('\n') + (errors.length ? '\nErrors: ' + errors.slice(-3).join(' | ') : '');
}
let diagUntil = 0;
setInterval(() => { const box = document.getElementById('diag'); if (Date.now() < diagUntil && !stage.hidden) { box.hidden = false; diag(); } else box.hidden = true; }, 1000);

function clearStage() {
  session++; timers.forEach(clearTimeout); timers = [];
  stage.querySelectorAll('video').forEach(v => releaseMedia(v));
  stage.innerHTML = '';
}

// Keep a copy of each video on the Fire Stick, so loops play from local storage instead of
// downloading the file again every time. Images are already kept by the browser.
const MEDIA_CACHE = 'ibexmecs-media-v1';
const localUrl = {};
window.SIGN_MEDIA = url => localUrl[url] || url;
let saving = Promise.resolve();
function saveVideos(L) { saving = saving.then(() => saveVideosNow(L)); }
async function saveVideosNow(L) {
  if (!window.caches || !window.fetch) return;
  const urls = [];
  (L.zones || []).forEach(z => (z.items || []).forEach(it => { if (it.kind === 'video' && it.url) urls.push(it.url); }));
  try {
    const cache = await caches.open(MEDIA_CACHE);
    for (const url of urls) {
      if (localUrl[url]) continue;
      let res = await cache.match(url);
      if (!res) {
        const net = await fetch(url, { mode: 'cors' });
        if (!net.ok) continue;
        await cache.put(url, net.clone()); res = net;
      }
      localUrl[url] = URL.createObjectURL(await res.blob());
    }
    // Forget videos that are no longer used by this screen.
    const keep = new Set(urls);
    (await cache.keys()).forEach(req => { if (!keep.has(req.url)) cache.delete(req); });
    Object.keys(localUrl).forEach(u => { if (!keep.has(u)) { URL.revokeObjectURL(localUrl[u]); delete localUrl[u]; } });
  } catch (e) { /* storage unavailable or full: keep streaming from the web */ }
}
let currentLayout = null, renderedAt = '';
function showLayout(L) {
  currentLayout = L;
  const key = JSON.stringify(L);
  if (key === shownKey) return;
  shownKey = key; clearStage(); renderedAt = vpKey();
  saveVideos(L);
  const mine = session;
  pair.hidden = true; stage.hidden = false;
  stage.style.background = L.bg || '#000'; if (/debug/.test(location.search + location.hash)) diagUntil = Date.now() + 40000;
  (L.zones || []).forEach(z => {
    const e = el('div', 'zone'); e.dataset.type = z.type; place(e, z);
    const c = el('div', 'zc'); e.append(c); stage.append(e);
    buildContent(c, z, true, timers, () => mine === session);
  });
}
function showPair(code, msg) {
  if (shownKey !== null) { clearStage(); shownKey = null; }
  stage.hidden = true; pair.hidden = false;
  document.getElementById('code').textContent = code || '········';
  if (msg) document.getElementById('pairMsg').textContent = msg;
}
function status(t) { document.getElementById('status').textContent = t || (pair.hidden ? '' : 'Browser ' + browserVer); }

async function poll() {
  try {
    let { data, error } = await sb.rpc('screen_config', { p_device: device });
    if (error) throw error;
    if (!data) {
      const r = await sb.rpc('register_screen', { p_device: device });
      if (r.error) throw r.error;
      data = { paired: false, pair_code: r.data, layout: null };
    }
    status('');
    if (data.paired && data.layout) {
      store('signage.lastLayout', JSON.stringify(data.layout));
      showLayout(data.layout);
    } else if (data.paired) {
      showPair(data.pair_code, (data.name || 'This screen') + ' is paired. Choose a layout for it in the dashboard.');
    } else {
      showPair(data.pair_code, 'In your Signage dashboard, open Screens and enter this code.');
    }
  } catch (e) {
    // Offline or server problem: keep showing whatever is on screen, or the last layout we saved.
    status('Offline · retrying');
    if (shownKey === null) {
      const last = store('signage.lastLayout');
      if (last) { try { showLayout(JSON.parse(last)); } catch (x) {} }
      else showPair(null, 'Waiting for internet connection…');
    }
  }
}

// Keep the TV awake where the browser allows it (the Fire Stick app also does this natively).
async function wake() { try { if (navigator.wakeLock) await navigator.wakeLock.request('screen'); } catch (e) {} }
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') wake(); });

// If the screen size changes after drawing (Fire TV settles its size a moment after start-up),
// draw the layout again so videos get the right size. Same as pressing the Menu button.
function vpKey() { const v = viewport(); return v.w + 'x' + v.h; }
function redrawIfResized() {
  if (currentLayout && shownKey !== null && vpKey() !== renderedAt) { shownKey = null; showLayout(currentLayout); }
}
addEventListener('resize', () => setTimeout(redrawIfResized, 400));

setInterval(redrawIfResized, 2000);

// Start only once the screen size has stayed the same for a moment.
function whenStable(cb) {
  let prev = '', same = 0, tries = 0;
  const t = setInterval(() => {
    const k = vpKey(); tries++;
    same = (k === prev && !/^0x|x0$/.test(k)) ? same + 1 : 0; prev = k;
    if (same >= 3 || tries > 25) { clearInterval(t); cb(); }
  }, 200);
}
whenStable(() => {
  const last = store('signage.lastLayout');
  if (last) { try { showLayout(JSON.parse(last)); } catch (e) {} }
  poll(); setInterval(poll, POLL_MS);
  // One extra redraw shortly after start-up, in case the video surface was sized before the screen settled.
  setTimeout(() => { if (currentLayout) { shownKey = null; showLayout(currentLayout); } }, 4000);
});
wake();
</script>
</body>
</html>
